note: >-
  One real hit. identity.reflexivity.com serves an RFC 8414 OAuth 2.0 Authorization Server Metadata
  document anonymously, and its scopes_supported enumerates 24 mcp:* scopes — the only public,
  machine-readable description of Reflexivity's API surface we could reach. Two hosts (docs.reflexivity.com
  and api-docs.tgl.ai, both the Theneo-hosted documentation site) answer 200 with an identical
  ~13.5KB HTML shell for EVERY /.well-known/* path; those are catch-all soft-200s, not documents, and
  are recorded as misses. reflexivity.com/api.reflexivity.com return honest 404s.
