reversibility:
  grade: unknown
  applicable: unknown
  note: >-
    NOT `na`, and NOT graded. Reflexivity's published capabilities are predominantly read-side —
    research, screening, scenario analysis, document search — which would make reversibility `na`. But
    the OAuth scope set includes `mcp:watchlist` and `mcp:file-processor`, both of which imply state a
    client creates and could need to undo, and the terminal exposes an `alfred/v1/feedback` write path.
    Because the API reference is password-protected, neither the write surface nor any reversal
    operation nor any window can be read. Asserting `na` would credit Reflexivity with having no
    reversal problem when it plainly has at least some write surface; asserting a window the docs do not
    state is the one error in this pipeline that could cost a user money. Recorded as unknown, with the
    reason, so a later pass with documentation access can grade it properly.
  write_surfaces_suspected:
  - scope: 'mcp:watchlist'
    reason: watchlists are user-created state
  - scope: 'mcp:file-processor'
    reason: document upload implies stored objects
  - path: alfred/v1/feedback
