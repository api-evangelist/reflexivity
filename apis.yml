apis:
- aid: reflexivity-api
  name: Reflexivity API
  description: Reflexivity's institutional REST API. Documented by the company as "JSON REST based services"
    whose requests are authenticated with an OAuth 2.0 Bearer token obtained from the Reflexivity OAuth
    service using an account id and secret issued by the Reflexivity back office. The production host
    api.reflexivity.com answers authenticated routes (an unauthenticated GET to /alfred/v1 returns 401
    behind a bearer gateway); the API reference itself is password-protected, so no public OpenAPI, operation
    list or rate-limit table could be captured.
  humanURL: https://api-docs.tgl.ai/
  baseURL: https://api.reflexivity.com
