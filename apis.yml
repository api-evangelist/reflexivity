aid: reflexivity
name: Reflexivity
description: Reflexivity (founded 2019 in New York as Toggle AI) is an institutional investment analysis
  platform that pairs licensed market data from S&P Global, LSEG Datastream, Cboe and Nasdaq with explainable
  AI agents that write and execute code to answer research questions across more than 40,000 stocks, bonds
  and commodities. Its published capabilities are Deep Research, Knowledge Graph, Portfolio Insights,
  Scenario Analysis, Document Intelligence and Smart Screening, delivered through a browser terminal and
  through a RESTful API sold to technology teams for custom model deployment, white-label distribution
  and real-time data feeds. The company raised a $30M Series B in October 2024 led by Greycroft with Interactive
  Brokers participating, is SOC 2 Type 2 audited annually, and gates both API credentials and its API
  reference behind a sales relationship.
